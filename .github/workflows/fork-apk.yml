name: Fork APK

# This fork's own build. Upstream's check.yml runs on main and on pull
# requests, tests first; this one builds the working branch and puts the APK
# first, so a red test still leaves something to install. The dev flavour is
# com.dev.bitchord, which installs beside the released app.
on:
  push:
    branches: [retro]
  workflow_dispatch:

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Dev APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      # One debug key for every run, so a new build installs over the last
      # one. Without the secret AGP makes a throwaway key and it does not.
      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew

      - name: Build the dev APK
        run: ./gradlew :app:assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      # The addon suites only: they cover what this branch changes, and
      # LocaleStringsTest is red upstream at 1.9.1 for keys it never translated.
      - name: Addon tests
        run: >
          ./gradlew :app:testDevDebugUnitTest
          --tests 'com.music.bitchord.AddonSourceTest'
          --tests 'com.music.bitchord.AddonPolicyTest'
          --tests 'com.music.bitchord.AddonAuthTest'
          --tests 'com.music.bitchord.AddonOrderTest'
          --tests 'com.music.bitchord.SourcesTest'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
